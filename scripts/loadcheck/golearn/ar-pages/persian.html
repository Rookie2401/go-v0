<!doctype html>
<html dir="rtl">
<head><meta charset="utf-8"><title>متن فارسی</title>
<style>body{font-family:serif;font-size:22px;line-height:2;max-width:900px;margin:20px auto;padding:0 16px}p{margin:0 0 6px}</style></head>
<body>
<p id="f1">تهران پایتخت ایران است و میلیون‌ها نفر در آن زندگی می‌کنند.</p>
<p id="f2">چای گرم را در صبح دوست دارم و با دوستانم به پارک می‌روم.</p>
<p id="f3">گربه‌ی کوچک پشت پنجره نشسته است.</p>
<p id="f4">ژاله و پدرش برای خرید به بازار رفتند.</p>
<p id="f5">این کتاب را از کتابخانه گرفتم و پگاه آن را خواند.</p>
</body>
</html>
