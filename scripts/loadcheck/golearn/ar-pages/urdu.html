<!doctype html>
<html dir="rtl">
<head><meta charset="utf-8"><title>اردو متن</title>
<style>body{font-family:serif;font-size:22px;line-height:2;max-width:900px;margin:20px auto;padding:0 16px}p{margin:0 0 6px}</style></head>
<body>
<p id="u1">پاکستان جنوبی ایشیا کا ایک ملک ہے۔</p>
<p id="u2">کراچی اس کا سب سے بڑا شہر ہے اور لاہور ثقافتی مرکز مانا جاتا ہے۔</p>
<p id="u3">بچے صبح اسکول جاتے ہیں اور شام کو کھیلتے ہیں۔</p>
<p id="u4">میں نے آج ایک نئی کتاب خریدی ہے۔</p>
<p id="u5">یہ موسم بہت اچھا ہے۔</p>
</body>
</html>
