<h1>아침 묵상</h1>
<p id="d1">하나님은 우리를 사랑하십니다. 우리는 날마다 기도하며 하나님께 감사를 드립니다. 어려운 때에도 주님은 우리와 함께 계십니다.</p>
<p id="d2">그분의 은혜로 우리는 새로운 힘을 얻습니다. 우리가 약할 때에 하나님은 우리를 붙들어 주십니다. 오늘도 평안한 마음으로 하루를 시작합시다.</p>
<p id="d3">이웃을 사랑하는 일은 믿음의 중요한 열매입니다. 교회는 서로 돕고 위로하는 공동체입니다. 우리는 말씀을 읽고 묵상하며 지혜를 구합니다.</p>
<p id="d4">지난주에 우리는 함께 예배를 드렸습니다. 주님의 평화가 여러분의 가정에 가득하기를 빕니다.</p>
