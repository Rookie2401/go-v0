<h1>Обычный день</h1>
<p id="p1">Она прочитала книгу. Потом она сказала, что это очень хорошая книга.</p>
<p id="p2">Дети идут в школу, а мать работает дома.</p>
<p id="p3">Изделия из стали стали дешевле.</p>
<p id="p4">Кто-то шел по улице и думал о завтрашнем дне.</p>
<p id="p5">Мой брат ходит в школу каждый день, а вчера мы ехали в город на поезде.</p>
