services:
  - type: web
    name: go-repository
    runtime: node
    plan: starter
    region: oregon
    autoDeployTrigger: "off"
    numInstances: 1
    buildCommand: npm ci --include=dev
    startCommand: node infra/repository/render-start.mjs
    healthCheckPath: /health
    maxShutdownDelaySeconds: 60
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: REPOSITORY_MIGRATION_PENDING
        value: "true"
      - key: REPOSITORY_DATA_DIR
        value: /var/data/repository
      # Off-site backups (docs/ops/BACKUP-RESTORE.md, "On Render"). Without them the only copies are on this one disk; /health says "offsite": false.
      - key: BACKUP_S3_ENDPOINT
        sync: false
      - key: BACKUP_S3_BUCKET
        sync: false
      - key: BACKUP_S3_ACCESS_KEY
        sync: false
      - key: BACKUP_S3_SECRET_KEY
        sync: false
      - key: BACKUP_PASSPHRASE
        sync: false
    disk:
      name: repository-data
      mountPath: /var/data
      sizeGB: 1
